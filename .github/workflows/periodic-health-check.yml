name: Deployed App Health Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to check'
        required: true
        default: 'https://pokedex-l6ij.onrender.com'


jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check URL health
        uses: jtalk/url-health-check-action@v5
        with:
          url: ${{ github.event.inputs.url  || 'https://pokedex-l6ij.onrender.com'}}
          max-attempts: 5
          retry-delay: 15s